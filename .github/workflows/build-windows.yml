name: Build Kara Shift Manager (Windows)
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - '**.py'
      - 'requirements.txt'
      - '.github/workflows/build-windows.yml'
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Compile and test
        run: |
          python -m py_compile main.py core/*.py tests/*.py
          python -m unittest discover -s tests -v
      - name: Validate Qt WebEngine
        run: python -c "from PySide6.QtWebEngineWidgets import QWebEngineView; print('Qt WebEngine import OK')"
      - name: Build application folder
        run: pyinstaller --noconfirm --clean --windowed --onedir --name KaraShiftManager --paths . --hidden-import core --hidden-import core.excel_reader --hidden-import core.mapping --hidden-import core.automation --collect-all PySide6 --collect-all shiboken6 main.py
      - uses: actions/upload-artifact@v4
        with:
          name: KaraShiftManager-Windows
          path: dist/KaraShiftManager/
          if-no-files-found: error
